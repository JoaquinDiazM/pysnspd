[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pysnspd"
version = "1.0.0"
description = "Multiscale SNSPD research simulations based on the thesis model, with documentation for its next model update."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Joaquin Andres Diaz Monge"}
]
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "PyYAML",
  "h5py",
  "meshpy",
  "shapely",
  "tqdm",
  "threadpoolctl",
]

[project.optional-dependencies]
dev = ["pytest", "tomli; python_version < '3.11'"]

[tool.setuptools.packages.find]
include = ["pysnspd*"]

[tool.setuptools.package-data]
"pysnspd.plotting" = ["*.mplstyle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
