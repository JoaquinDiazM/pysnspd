[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pysnspd"
version = "1.1.1"
description = "Conserving effective BCS/KWT SNSPD simulations with native quasiparticle/phonon kinetics and the thesis bias/readout circuit."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Joaquin Andres Diaz Monge"}
]
dependencies = [
  "numpy>=2.0",
  "scipy",
  "matplotlib",
  "PyYAML",
  "h5py",
  "meshpy",
  "shapely",
  "tqdm",
  "threadpoolctl",
]

[project.optional-dependencies]
performance = ["numba>=0.64,<0.65"]
dev = ["pytest", "tomli; python_version < '3.11'"]

[tool.setuptools.packages.find]
include = ["pysnspd*"]

[tool.setuptools.package-data]
"pysnspd.plotting" = ["*.mplstyle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
